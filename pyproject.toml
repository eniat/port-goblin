[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portgoblin"
version = "0.1.0"
description = "Knocking on every door. nmap scanning and triage for infrastructure tests."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Taine" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "black>=24",
]

[project.urls]
Homepage = "https://github.com/eniat"

[project.scripts]
portgoblin = "portgoblin.cli:app"

[tool.setuptools.packages.find]
include = ["portgoblin*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM"]
# The spec defines Status as (str, Enum); keep that form.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["portgoblin", "conftest"]
